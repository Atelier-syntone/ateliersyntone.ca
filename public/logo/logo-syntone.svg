<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Define gradients and styles -->
  <defs>
    <style>
      .figure-head { fill: currentColor; }
      .figure-body { fill: currentColor; }
      .star { fill: #E8B84B; }
      .leaf { fill: #3A8C6E; }
    </style>
  </defs>

  <!-- Circular swoosh arc wrapping around the group -->
  <path d="M 25 20 A 30 30 0 0 1 75 20"
        stroke="#3A8C6E"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        opacity="0.8"/>

  <!-- Bicolor heart above and between the figures -->
  <g transform="translate(50, 18)">
    <!-- Left half (teal) -->
    <path d="M 0 0 C -2.5 -1.5 -4 -1 -4 -2.5 C -4 -4 -2.5 -5 -1.5 -5 C -0.5 -5 0 -4.2 0 -3 L 0 0 Z"
          fill="#2D6EA0"/>
    <!-- Right half (coral) -->
    <path d="M 0 0 C 2.5 -1.5 4 -1 4 -2.5 C 4 -4 2.5 -5 1.5 -5 C 0.5 -5 0 -4.2 0 -3 L 0 0 Z"
          fill="#D96B5A"/>
    <!-- Bottom point of heart -->
    <path d="M -4 -2.5 Q -5 0 0 4 Q 5 0 4 -2.5"
          fill="#2D6EA0"/>
    <path d="M 4 -2.5 Q 5 0 0 4 Q 0 4 0 4"
          fill="#D96B5A"/>
  </g>

  <!-- Left adult figure (blue) -->
  <g>
    <!-- Head -->
    <circle cx="28" cy="32" r="4.5" fill="#2D6EA0"/>
    <!-- Body -->
    <ellipse cx="28" cy="42" rx="3" ry="5" fill="#2D6EA0"/>
    <!-- Left arm -->
    <line x1="25" y1="40" x2="18" y2="39" stroke="#2D6EA0" stroke-width="2" stroke-linecap="round"/>
    <!-- Right arm -->
    <line x1="31" y1="40" x2="38" y2="41" stroke="#2D6EA0" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="27" y1="47" x2="25" y2="55" stroke="#2D6EA0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="29" y1="47" x2="31" y2="55" stroke="#2D6EA0" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Center child figure (yellow/gold with arms open) -->
  <g>
    <!-- Head -->
    <circle cx="50" cy="30" r="5" fill="#E8B84B"/>
    <!-- Body -->
    <ellipse cx="50" cy="41" rx="3.2" ry="5.5" fill="#E8B84B"/>
    <!-- Left arm (open) -->
    <line x1="46.8" y1="39" x2="35" y2="35" stroke="#E8B84B" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right arm (open) -->
    <line x1="53.2" y1="39" x2="65" y2="35" stroke="#E8B84B" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="49" y1="46" x2="47" y2="55" stroke="#E8B84B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="51" y1="46" x2="53" y2="55" stroke="#E8B84B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Right adult figure (blue) -->
  <g>
    <!-- Head -->
    <circle cx="72" cy="32" r="4.5" fill="#2D6EA0"/>
    <!-- Body -->
    <ellipse cx="72" cy="42" rx="3" ry="5" fill="#2D6EA0"/>
    <!-- Left arm -->
    <line x1="69" y1="40" x2="62" y2="41" stroke="#2D6EA0" stroke-width="2" stroke-linecap="round"/>
    <!-- Right arm -->
    <line x1="75" y1="40" x2="82" y2="39" stroke="#2D6EA0" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="71" y1="47" x2="69" y2="55" stroke="#2D6EA0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="73" y1="47" x2="75" y2="55" stroke="#2D6EA0" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Decorative stars -->
  <!-- Top left star -->
  <g transform="translate(18, 15)">
    <path d="M 0,-1.5 L 0.4,-0.3 L 1.5,-0.1 L 0.7,0.5 L 1,1.5 L 0,-0.8 L -1,1.5 L -0.7,0.5 L -1.5,-0.1 L -0.4,-0.3 Z"
          fill="#E8B84B" opacity="0.7"/>
  </g>

  <!-- Top right star -->
  <g transform="translate(82, 18)">
    <path d="M 0,-1.2 L 0.3,-0.25 L 1.2,-0.1 L 0.55,0.35 L 0.8,1.2 L 0,-0.6 L -0.8,1.2 L -0.55,0.35 L -1.2,-0.1 L -0.3,-0.25 Z"
          fill="#E8B84B" opacity="0.7"/>
  </g>

  <!-- Small leaf element (bottom right) -->
  <g transform="translate(75, 60)">
    <path d="M 0,0 Q 1.5,-0.5 2,-1.5 Q 1,-1 0,-1 Q -1,-1 0,0 Z"
          fill="#3A8C6E" opacity="0.8"/>
    <line x1="0" y1="0" x2="1.2" y2="-0.8" stroke="#3A8C6E" stroke-width="0.3" opacity="0.6"/>
  </g>

</svg>